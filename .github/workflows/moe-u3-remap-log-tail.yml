name: Capture MoE Remap Regression Failure

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-log-tail.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0
      - name: Capture V3 failed job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/jobs/90300096038/logs > /tmp/job.log
          {
            grep -E 'test-moe-route-remap|GGML_ASSERT|FAILED|Error|error:|Aborted|Segmentation|remap graph|argsort|GET_ROWS' /tmp/job.log || true
            echo '--- tail ---'
            tail -n 100 /tmp/job.log
          } > .github/moe-u3-remap-regression-v3.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-remap-regression-v3.log
          git commit -m 'ci: record V3 MoE remap regression failure'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
