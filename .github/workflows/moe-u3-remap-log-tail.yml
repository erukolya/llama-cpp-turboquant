name: Capture MoE Remap Regression Failure

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-log-tail.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0
      - name: Capture compiler diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/jobs/90302135131/logs > /tmp/job.log
          grep -E -B 4 -A 8 'error:|undefined reference|FAILED:|ninja: build stopped|GGML_ASSERT' /tmp/job.log \
            > .github/moe-u3-remap-compiler-errors.log || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-remap-compiler-errors.log
          git commit -m 'ci: record MoE remap compiler errors'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
