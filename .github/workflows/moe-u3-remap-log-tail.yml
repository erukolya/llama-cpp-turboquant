name: Capture MoE Remap Regression Failure

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-log-tail.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0
      - name: Capture compiler diagnostics without masking API errors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api repos/${GITHUB_REPOSITORY}/actions/jobs/90302135131/logs > /tmp/job.log 2> /tmp/gh.err
          api_rc=$?
          {
            echo "api_exit_code=$api_rc"
            echo "--- gh stderr ---"
            cat /tmp/gh.err
            echo "--- downloaded file ---"
            file /tmp/job.log || true
            wc -c /tmp/job.log || true
            echo "--- compiler matches ---"
            grep -E -B 4 -A 8 'error:|undefined reference|FAILED:|ninja: build stopped|GGML_ASSERT' /tmp/job.log || true
            echo "--- final 120 lines ---"
            tail -n 120 /tmp/job.log || true
          } > .github/moe-u3-remap-compiler-errors.log
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-remap-compiler-errors.log
          git commit -m 'ci: record exact MoE compiler diagnostics'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
