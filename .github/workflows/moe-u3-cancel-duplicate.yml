name: Cancel Duplicate MoE U3 Run

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-cancel-duplicate.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Cancel queued duplicate and remove locator files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/30339934957/cancel" || true

          git rm -f --ignore-unmatch \
            .github/workflows/moe-u3-run-locator.yml \
            .github/workflows/moe-u3-cancel-duplicate.yml \
            .github/moe-u3-runs.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: cancel duplicate U3 build and remove locator'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
