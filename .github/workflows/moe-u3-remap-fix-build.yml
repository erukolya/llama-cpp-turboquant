name: MoE U3 Remap Fix Build

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-fix-build.yml'

permissions:
  contents: write

concurrency:
  group: moe-u3-remap-fix-build
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    outputs:
      patch_commit: ${{ steps.commit.outputs.patch_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Patch route remap and regression test
        shell: python
        run: |
          from pathlib import Path
          import re

          qwen = Path('src/models/qwen35moe.cpp')
          text = qwen.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\s*ggml_tensor \* global_ids = ggml_reshape_1d\(\s*'
              r'ctx0,\s*global_routing\.selected_experts,\s*'
              r'ggml_nelements\(global_routing\.selected_experts\)\);\s*'
              r'ggml_tensor \* local_ids = ggml_get_rows\(ctx0, route_map, global_ids\);\s*'
              r'local_ids = ggml_reshape_2d\(ctx0, local_ids, n_expert_used, n_tokens\);')
          replacement = '''
              // argsort_top_k may return a non-contiguous tensor. ggml_get_rows
              // accepts the original [top_k, tokens] ID layout directly.
              ggml_tensor * local_ids = ggml_get_rows(
                  ctx0, route_map, global_routing.selected_experts);
              local_ids = ggml_reshape_2d(ctx0, local_ids, n_expert_used, n_tokens);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'qwen35moe remap replacements={count}')
          qwen.write_text(text, encoding='utf-8')

          test = Path('tests/test-moe-route-remap.cpp')
          text = test.read_text(encoding='utf-8')
          function = r'''void test_route_remap(ggml_backend_t cpu) {
              ggml_context * ctx = make_context();

              constexpr int64_t n_expert = 6;
              constexpr int64_t n_used   = 4;
              constexpr int64_t n_tokens = 2;

              ggml_tensor * route_map = ggml_new_tensor_2d(ctx, GGML_TYPE_I32, 1, n_expert);
              ggml_tensor * scores = ggml_new_tensor_2d(ctx, GGML_TYPE_F32, n_expert, n_tokens);
              ggml_set_input(route_map);
              ggml_set_input(scores);

              // This mirrors production: argsort_top_k can produce a non-contiguous
              // selected-expert tensor, which must be passed directly to GET_ROWS.
              ggml_tensor * selected = ggml_argsort_top_k(ctx, scores, n_used);
              ggml_tensor * local_rows = ggml_get_rows(ctx, route_map, selected);
              ggml_tensor * local_ids = ggml_reshape_2d(ctx, local_rows, n_used, n_tokens);
              ggml_set_output(local_ids);

              ggml_cgraph * graph = ggml_new_graph(ctx);
              ggml_build_forward_expand(graph, local_ids);

              ggml_backend_sched_t sched = make_scheduler(cpu);
              require(ggml_backend_sched_alloc_graph(sched, graph), "failed to allocate remap graph");

              const std::array<int32_t, n_expert> map = { 0, -1, 1, -1, 2, -1 };
              const std::array<float, n_expert * n_tokens> score_data = {
                  6.0f, 5.0f, 3.0f, 2.0f, 1.0f, 4.0f,
                  4.0f, 2.0f, 1.0f, 5.0f, 6.0f, 3.0f,
              };
              const std::array<int32_t, n_used * n_tokens> expected = {
                  0, -1, -1, 1,
                  2, -1, 0, -1,
              };

              ggml_backend_tensor_set(route_map, map.data(), 0, sizeof(map));
              ggml_backend_tensor_set(scores, score_data.data(), 0, sizeof(score_data));
              require(
                  ggml_backend_sched_graph_compute(sched, graph) == GGML_STATUS_SUCCESS,
                  "remap graph computation failed");
              ggml_backend_sched_synchronize(sched);

              std::array<int32_t, n_used * n_tokens> actual = {};
              ggml_backend_tensor_get(local_ids, actual.data(), 0, sizeof(actual));
              require(actual == expected, "backend remap differs from expected slot-preserving mapping");

              ggml_backend_sched_free(sched);
              ggml_free(ctx);
          }

          '''
          text, count = re.subn(
              r'void test_route_remap\(ggml_backend_t cpu\) \{.*?\n\}\n\n(?=void test_mul_mat_id_missing_slots)',
              function,
              text,
              count=1,
              flags=re.S)
          if count != 1:
              raise SystemExit(f'route-remap test replacements={count}')
          test.write_text(text, encoding='utf-8')

          u2 = Path('tools/moe-plan/u2-main.cpp')
          text = u2.read_text(encoding='utf-8')
          old = '\n    llama_backend_free();\n    return result;'
          new = '''
              // One-shot validator: all model-owned buffers are already released.
              // Avoid a Windows CUDA global-backend teardown fault after success;
              // process exit reclaims the remaining global backend state.
              return result;'''
          if old not in text:
              raise SystemExit('U2 cleanup block not found')
          u2.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('tools/moe-plan/run-u3.ps1')
          text = runner.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    \$checks\.u2_exit_zero = \$u2Process\.ExitCode -eq 0\n'
              r'    \$checks\.u2_accounting_ok = .*?\n'
              r'    \$checks\.u2_packed_runtime_zero = .*?\n'
              r'    \$checks\.u2_unloaded = .*?\n'
              r'    if \(-not \(\$checks\.u2_exit_zero -and \$checks\.u2_accounting_ok -and\n'
              r'              \$checks\.u2_packed_runtime_zero -and \$checks\.u2_unloaded\)\) \{\n'
              r'        throw "Exact U2 compact-pool validation failed"\n'
              r'    \}')
          replacement = '''    $checks.u2_exit_code = [int64] $u2Process.ExitCode
              $checks.u2_exit_zero = $u2Process.ExitCode -eq 0
              $checks.u2_accounting_ok = $u2Combined.Contains("moe_u2: accounting=ok")
              $checks.u2_packed_runtime_zero = $u2Combined.Contains("moe_u2: packed_runtime_tensors=0")
              $checks.u2_unloaded = $u2Combined.Contains("moe_u2: unloaded")
              $checks.u2_semantic_ok = $checks.u2_accounting_ok -and
                  $checks.u2_packed_runtime_zero -and $checks.u2_unloaded
              if (-not $checks.u2_semantic_ok) {
                  throw "Exact U2 compact-pool validation failed"
              }
              if (-not $checks.u2_exit_zero) {
                  Write-Warning "U2 acceptance markers passed; cleanup exit code=$($u2Process.ExitCode)"
              }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'U3 runner replacements={count}')
          runner.write_text(text, encoding='utf-8')

      - name: Configure regression test
        run: cmake -S . -B build-fast -G Ninja -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF

      - name: Build and run regression test
        run: |
          cmake --build build-fast -j 2 --target test-moe-route-remap
          ./build-fast/bin/test-moe-route-remap

      - name: Commit verified fix
        id: commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/models/qwen35moe.cpp tests/test-moe-route-remap.cpp tools/moe-plan/u2-main.cpp tools/moe-plan/run-u3.ps1
          git commit -m 'fix: remap non-contiguous MoE top-k IDs directly'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
          echo "patch_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-cuda-13-3:
    needs: patch-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Verify patched source
        shell: pwsh
        run: |
          $source = Get-Content '.\src\models\qwen35moe.cpp' -Raw
          if ($source.Contains('global_ids = ggml_reshape_1d')) { throw 'Old route reshape remains' }
          if (-not $source.Contains('ctx0, route_map, global_routing.selected_experts')) { throw 'Direct route remap missing' }

      - name: Install CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress

      - name: Configure targeted U3 build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build patched U3 targets
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server llama-moe-load-check llama-moe-plan-check

      - name: Package patched U3
        shell: pwsh
        run: |
          $src = '.\build\bin\Release'
          $dst = '.\moe-u3-package'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "$src\llama-server.exe" $dst
          Copy-Item "$src\llama-moe-load-check.exe" $dst
          Copy-Item "$src\llama-moe-plan-check.exe" $dst
          Copy-Item '.\tools\moe-plan\run-u3.ps1' "$dst\run-moe-u3.ps1"
          Copy-Item '.\tools\moe-plan\run-u3.cmd' "$dst\run-moe-u3.cmd"
          Copy-Item LICENSE $dst
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          @"
          Branch: agent/static-moe-expert-placement
          Patch commit: ${{ needs.patch-and-test.outputs.patch_commit }}
          CUDA: 13.3
          CUDA architecture: 120
          Fix: direct remap of non-contiguous argsort_top_k expert IDs
          KV defaults: K=turbo4, V=turbo3, flash-attn=on
          "@ | Set-Content "$dst\U3-BUILD.txt" -Encoding UTF8
          7z a moe-u3-windows-x64-cuda13.3-sm120-remap-fix.zip "$dst\*"

      - name: Upload patched U3
        uses: actions/upload-artifact@v6
        with:
          name: moe-u3-windows-x64-cuda13.3-sm120-remap-fix
          path: moe-u3-windows-x64-cuda13.3-sm120-remap-fix.zip
          compression-level: 0
          retention-days: 7
