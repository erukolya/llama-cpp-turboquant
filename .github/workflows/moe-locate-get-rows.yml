name: Locate GET_ROWS Types

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-locate-get-rows.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Locate GET_ROWS implementations
        shell: bash
        run: |
          {
            echo '=== declarations and constructors ==='
            rg -n -C 8 'ggml_get_rows\(|GGML_OP_GET_ROWS' ggml/src ggml/include | head -n 500
            echo '=== CPU forward implementations ==='
            rg -n -C 40 'compute_forward_get_rows|get_rows.*GGML_TYPE_I32|GGML_TYPE_I32.*get_rows' ggml/src/ggml-cpu | head -n 800
            echo '=== CUDA implementations ==='
            rg -n -C 40 'GET_ROWS|get_rows' ggml/src/ggml-cuda | head -n 800
          } > moe-get-rows-locations.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add moe-get-rows-locations.txt
          git commit -m 'ci: capture GET_ROWS type support'
          git push origin HEAD:agent/static-moe-expert-placement
