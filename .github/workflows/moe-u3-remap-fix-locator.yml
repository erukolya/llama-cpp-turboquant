name: Locate MoE U3 Remap Fix Build

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-fix-locator.yml'

permissions:
  actions: read
  pull-requests: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - name: Report final remap V2 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- moe-u3-final-remap-build-v2-status -->'
            echo '### MoE U3 final remap V2 workflow runs'
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/moe-u3-final-remap-build-v2.yml/runs?branch=agent%2Fstatic-moe-expert-placement&per_page=5" \
              --jq '.workflow_runs[] | "- run `\(.id)`: **\(.status)** / `\(.conclusion // "pending")`, head `\(.head_sha)`, \(.html_url)"'
          } > /tmp/status.md
          gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
