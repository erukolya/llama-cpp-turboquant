name: Apply MoE Route Storage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/moe-apply-route-storage.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Add model-owned route maps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          header = Path('src/llama-moe-route-partition.h')
          text = header.read_text()
          text = text.replace(
              'constexpr int32_t LLAMA_MOE_ROUTE_MISSING = -1;\n',
              'constexpr int32_t LLAMA_MOE_ROUTE_MISSING = -1;\n\n'
              'std::string llama_moe_route_map_tensor_name(int32_t layer, llama_moe_load_backend backend);\n')
          header.write_text(text)

          cpp = Path('src/llama-moe-route-partition.cpp')
          text = cpp.read_text()
          marker = '} // namespace\n\nbool llama_moe_route_maps_build('
          insert = '''} // namespace

std::string llama_moe_route_map_tensor_name(int32_t layer, llama_moe_load_backend backend) {
    const char * suffix = backend == llama_moe_load_backend::cpu ? "cpu" : "gpu";
    return "moe.route_map." + std::to_string(layer) + "." + suffix;
}

bool llama_moe_route_maps_build('''
          if text.count(marker) != 1:
              raise SystemExit('route-partition.cpp namespace marker mismatch')
          cpp.write_text(text.replace(marker, insert, 1))

          model_h = 'src/llama-model.h'
          replace_once(model_h,
          '''    const llama_moe_load_placement_snapshot * moe_placement() const noexcept;
              llama_moe_compact_storage & moe_cpu_storage() noexcept;
              llama_moe_compact_storage & moe_gpu_storage() noexcept;
          ''',
          '''    const llama_moe_load_placement_snapshot * moe_placement() const noexcept;
              llama_moe_compact_storage & moe_cpu_storage() noexcept;
              llama_moe_compact_storage & moe_gpu_storage() noexcept;
              const llama_moe_compact_storage & moe_cpu_storage() const noexcept;
              const llama_moe_compact_storage & moe_gpu_storage() const noexcept;
              llama_moe_compact_storage & moe_cpu_route_storage() noexcept;
              llama_moe_compact_storage & moe_gpu_route_storage() noexcept;
              const llama_moe_compact_storage & moe_cpu_route_storage() const noexcept;
              const llama_moe_compact_storage & moe_gpu_route_storage() const noexcept;
          ''')

          model_cpp = 'src/llama-model.cpp'
          replace_once(model_cpp,
          '''    llama_moe_compact_storage moe_cpu_storage;
              llama_moe_compact_storage moe_gpu_storage;

              bool has_tensor_overrides;
          ''',
          '''    llama_moe_compact_storage moe_cpu_storage;
              llama_moe_compact_storage moe_gpu_storage;
              llama_moe_compact_storage moe_cpu_route_storage;
              llama_moe_compact_storage moe_gpu_route_storage;

              bool has_tensor_overrides;
          ''')
          replace_once(model_cpp,
          '''llama_moe_compact_storage & llama_model_base::moe_gpu_storage() noexcept {
              return pimpl->moe_gpu_storage;
          }

          void llama_model_base::create_tensor_gate_up_exps''',
          '''llama_moe_compact_storage & llama_model_base::moe_gpu_storage() noexcept {
              return pimpl->moe_gpu_storage;
          }

          const llama_moe_compact_storage & llama_model_base::moe_cpu_storage() const noexcept {
              return pimpl->moe_cpu_storage;
          }

          const llama_moe_compact_storage & llama_model_base::moe_gpu_storage() const noexcept {
              return pimpl->moe_gpu_storage;
          }

          llama_moe_compact_storage & llama_model_base::moe_cpu_route_storage() noexcept {
              return pimpl->moe_cpu_route_storage;
          }

          llama_moe_compact_storage & llama_model_base::moe_gpu_route_storage() noexcept {
              return pimpl->moe_gpu_route_storage;
          }

          const llama_moe_compact_storage & llama_model_base::moe_cpu_route_storage() const noexcept {
              return pimpl->moe_cpu_route_storage;
          }

          const llama_moe_compact_storage & llama_model_base::moe_gpu_route_storage() const noexcept {
              return pimpl->moe_gpu_route_storage;
          }

          void llama_model_base::create_tensor_gate_up_exps''')

          qwen = 'src/models/qwen35moe.cpp'
          replace_once(qwen,
          '''#include "llama-moe-registry.h"

          #include "ggml-cpu.h"
          ''',
          '''#include "llama-moe-registry.h"
          #include "llama-moe-route-partition.h"

          #include "ggml-cpu.h"
          ''')
          replace_once(qwen,
          '''        if (!compact_registry.create_storages(
                          ggml_backend_cpu_buffer_type(),
                          ggml_backend_dev_buffer_type(compact_gpu_device),
                          moe_cpu_storage(), moe_gpu_storage(), compact_error)) {
                      throw std::runtime_error("cannot allocate compact routed-expert pools: " + compact_error);
                  }

                  const size_t previous_size_data = ml.size_data;
          ''',
          '''        if (!compact_registry.create_storages(
                          ggml_backend_cpu_buffer_type(),
                          ggml_backend_dev_buffer_type(compact_gpu_device),
                          moe_cpu_storage(), moe_gpu_storage(), compact_error)) {
                      throw std::runtime_error("cannot allocate compact routed-expert pools: " + compact_error);
                  }

                  std::vector<llama_moe_compact_tensor_spec> cpu_route_specs;
                  std::vector<llama_moe_compact_tensor_spec> gpu_route_specs;
                  cpu_route_specs.reserve(static_placement->layers.size());
                  gpu_route_specs.reserve(static_placement->layers.size());
                  for (const auto & layer_placement : static_placement->layers) {
                      const std::array<int64_t, GGML_MAX_DIMS> ne = {
                          1, static_cast<int64_t>(layer_placement.expert_count), 1, 1 };
                      cpu_route_specs.push_back({
                          llama_moe_route_map_tensor_name(layer_placement.layer, llama_moe_load_backend::cpu),
                          GGML_TYPE_I32, ne });
                      gpu_route_specs.push_back({
                          llama_moe_route_map_tensor_name(layer_placement.layer, llama_moe_load_backend::gpu),
                          GGML_TYPE_I32, ne });
                  }
                  if (!moe_cpu_route_storage().create(
                          ggml_backend_cpu_buffer_type(), cpu_route_specs, compact_error)) {
                      throw std::runtime_error("cannot allocate CPU MoE route maps: " + compact_error);
                  }
                  if (!moe_gpu_route_storage().create(
                          ggml_backend_dev_buffer_type(compact_gpu_device), gpu_route_specs, compact_error)) {
                      throw std::runtime_error("cannot allocate GPU MoE route maps: " + compact_error);
                  }
                  for (const auto & layer_placement : static_placement->layers) {
                      llama_moe_route_maps maps;
                      if (!llama_moe_route_maps_build(layer_placement, maps, compact_error)) {
                          throw std::runtime_error(
                              "cannot build MoE route maps for layer " +
                              std::to_string(layer_placement.layer) + ": " + compact_error);
                      }
                      ggml_tensor * cpu_map = moe_cpu_route_storage().find_tensor(
                          llama_moe_route_map_tensor_name(layer_placement.layer, llama_moe_load_backend::cpu));
                      ggml_tensor * gpu_map = moe_gpu_route_storage().find_tensor(
                          llama_moe_route_map_tensor_name(layer_placement.layer, llama_moe_load_backend::gpu));
                      if (cpu_map == nullptr || gpu_map == nullptr) {
                          throw std::runtime_error("allocated MoE route map tensor is missing");
                      }
                      ggml_backend_tensor_set(
                          cpu_map, maps.cpu_local_by_global.data(), 0,
                          maps.cpu_local_by_global.size() * sizeof(int32_t));
                      ggml_backend_tensor_set(
                          gpu_map, maps.gpu_local_by_global.data(), 0,
                          maps.gpu_local_by_global.size() * sizeof(int32_t));
                  }

                  const size_t previous_size_data = ml.size_data;
          ''')
          replace_once(qwen,
          '''            "GPU=%.2f MiB logical / %.2f MiB allocated, packed runtime bytes=0\\n",
                      __func__, compact_registry.binding_count(),
          ''',
          '''            "GPU=%.2f MiB logical / %.2f MiB allocated, route maps=%zu CPU + %zu GPU, packed runtime bytes=0\\n",
                      __func__, compact_registry.binding_count(),
          ''')
          replace_once(qwen,
          '''            moe_gpu_storage().logical_tensor_bytes() / 1024.0 / 1024.0,
                      moe_gpu_storage().allocated_buffer_bytes() / 1024.0 / 1024.0);
          ''',
          '''            moe_gpu_storage().logical_tensor_bytes() / 1024.0 / 1024.0,
                      moe_gpu_storage().allocated_buffer_bytes() / 1024.0 / 1024.0,
                      moe_cpu_route_storage().tensor_count(),
                      moe_gpu_route_storage().tensor_count());
          ''')

          test = Path('tests/test-moe-route-partition.cpp')
          text = test.read_text()
          marker = '''void test_mixed_partition_preserves_slots() {
          '''
          insert = '''void test_route_map_tensor_names() {
              assert(llama_moe_route_map_tensor_name(7, llama_moe_load_backend::cpu) == "moe.route_map.7.cpu");
              assert(llama_moe_route_map_tensor_name(7, llama_moe_load_backend::gpu) == "moe.route_map.7.gpu");
          }

          void test_mixed_partition_preserves_slots() {
          '''
          if text.count(marker) != 1:
              raise SystemExit('route test marker mismatch')
          text = text.replace(marker, insert, 1)
          text = text.replace(
              '''int main() {
              test_mixed_partition_preserves_slots();
          ''',
              '''int main() {
              test_route_map_tensor_names();
              test_mixed_partition_preserves_slots();
          ''', 1)
          test.write_text(text)
          PY

          git diff --check

      - name: Configure CPU compile check
        run: >-
          cmake -S . -B build-route -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and run route checks
        run: |
          cmake --build build-route --parallel --target llama-moe-load-check test-moe-route-partition
          ctest --test-dir build-route --output-on-failure -R '^test-moe-route-partition$'

      - name: Commit route storage
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/llama-model.h src/llama-model.cpp src/llama-moe-route-partition.h src/llama-moe-route-partition.cpp src/models/qwen35moe.cpp tests/test-moe-route-partition.cpp
          git commit -m 'moe: persist backend route maps with the model'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
