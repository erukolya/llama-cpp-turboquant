name: MoE Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/moe-fast-ci.yml'
      - '.github/workflows/moe-apply-graph-refactor.yml'
      - 'src/llama-graph.h'
      - 'src/llama-graph.cpp'
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-fast-ci.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  apply-graph-refactor:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply corrected graph refactor
        shell: bash
        run: |
          if ! python3 - <<'PY' > graph-refactor-error.txt 2>&1
          from pathlib import Path

          lines = Path('.github/workflows/moe-apply-graph-refactor.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          script = script.replace(
              "needle = '''ggml_tensor * llm_graph_context::build_moe_ffn(\\n                   ggml_tensor * cur,\\n                   ggml_tensor * gate_inp,\\n                   ggml_tensor * gate_inp_b,",
              "needle = '''ggml_tensor * llm_graph_context::build_moe_ffn(\\n         ggml_tensor * cur,\\n         ggml_tensor * gate_inp,\\n         ggml_tensor * gate_inp_b,")
          exec(compile(script, 'graph-refactor-patch.py', 'exec'))
          PY
          then
            cat graph-refactor-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add graph-refactor-error.txt
            git commit -m 'ci: capture graph refactor patch error'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit 1
          fi
          rm -f graph-refactor-error.txt
          git diff --check

      - name: Configure CPU compile check
        run: >-
          cmake -S . -B build-graph -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build graph and MoE tests
        run: |
          cmake --build build-graph --parallel --target llama-moe-load-check test-moe-route-partition test-moe-registry
          ctest --test-dir build-graph --output-on-failure -R '^test-moe-(route-partition|registry)$'

      - name: Commit graph refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/llama-graph.h src/llama-graph.cpp
          git commit -m 'moe: separate routing from expert execution'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
