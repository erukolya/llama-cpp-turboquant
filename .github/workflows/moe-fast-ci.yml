name: MoE Fast CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/moe-fast-ci.yml'
      - 'src/llama-moe-*.h'
      - 'src/llama-moe-*.cpp'
      - 'src/llama-graph.h'
      - 'src/llama-graph.cpp'
      - 'src/llama-model.h'
      - 'src/models/qwen35moe.cpp'
      - 'ggml/src/ggml-cpu/ggml-cpu.c'
      - 'ggml/src/ggml-cpu/repack.cpp'
      - 'ggml/src/ggml-cuda/ggml-cuda.cu'
      - 'ggml/src/ggml-cuda/mmid.cu'
      - 'tests/test-moe-*.cpp'
      - 'tools/moe-plan/**'
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-fast-ci.yml'
      - 'src/llama-moe-*.h'
      - 'src/llama-moe-*.cpp'
      - 'src/llama-graph.h'
      - 'src/llama-graph.cpp'
      - 'src/llama-model.h'
      - 'src/models/qwen35moe.cpp'
      - 'ggml/src/ggml-cpu/ggml-cpu.c'
      - 'ggml/src/ggml-cpu/repack.cpp'
      - 'ggml/src/ggml-cuda/ggml-cuda.cu'
      - 'ggml/src/ggml-cuda/mmid.cu'
      - 'tests/test-moe-*.cpp'
      - 'tools/moe-plan/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  moe-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: ubuntu
          - os: windows-2025
            name: windows
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build
          -DBUILD_SHARED_LIBS=ON
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake
          -DBUILD_SHARED_LIBS=ON
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON

      - name: Build MoE targets
        shell: bash
        run: >-
          cmake --build build --config Release --parallel
          --target
          test-moe-load-scope
          test-moe-load-shared
          test-moe-pool-plan
          test-moe-storage
          test-moe-registry
          test-moe-route-partition
          test-moe-route-remap

      - name: Run MoE tests
        shell: bash
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          -R '^test-moe-(load-scope|load-shared|pool-plan|storage|registry|route-partition|route-remap)$'

  u2-static-tool:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: u2-ubuntu
          - os: windows-2025
            name: u2-windows
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure Ubuntu static tool
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build-u2 -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows static tool
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          cmake -S . -B build-u2 -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=OFF

      - name: Build U2 loader check
        shell: bash
        run: >-
          cmake --build build-u2 --config Release --parallel
          --target llama-moe-load-check
