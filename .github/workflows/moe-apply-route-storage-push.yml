name: Apply MoE Route Storage Push

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-apply-route-storage-push.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Apply route-storage patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/moe-apply-route-storage.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(script, 'route-storage-patch.py', 'exec'))
          PY
          git diff --check

      - name: Configure CPU compile check
        run: >-
          cmake -S . -B build-route -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and run route checks
        run: |
          cmake --build build-route --parallel --target llama-moe-load-check test-moe-route-partition
          ctest --test-dir build-route --output-on-failure -R '^test-moe-route-partition$'

      - name: Commit route storage
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/llama-model.h src/llama-model.cpp src/llama-moe-route-partition.h src/llama-moe-route-partition.cpp src/models/qwen35moe.cpp tests/test-moe-route-partition.cpp
          git commit -m 'moe: persist backend route maps with the model'
          git push origin HEAD:agent/static-moe-expert-placement
