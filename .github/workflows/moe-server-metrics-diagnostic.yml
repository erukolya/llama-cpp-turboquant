name: MoE Server Metrics Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-server-metrics-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Add MoE runtime metrics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/server/server-context.cpp')
          text = path.read_text()

          old = '''struct server_context_impl {
              friend struct server_context;

          public:
          '''
          new = '''struct server_context_impl {
              friend struct server_context;
              friend struct server_routes;

          public:
          '''
          if text.count(old) != 1:
              raise SystemExit(f'server_context_impl friend marker count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        auto res_task = dynamic_cast<server_task_result_metrics*>(result.get());
                  GGML_ASSERT(res_task != nullptr);

                  // metrics definition: https://prometheus.io/docs/practices/naming/#metric-names
          '''
          new = '''        auto res_task = dynamic_cast<server_task_result_metrics*>(result.get());
                  GGML_ASSERT(res_task != nullptr);

                  const auto moe_copy_stats = llama_moe_copy_stats(ctx_server.ctx_tgt);
                  const auto moe_exec_stats = llama_moe_exec_stats(ctx_server.ctx_tgt);

                  // metrics definition: https://prometheus.io/docs/practices/naming/#metric-names
          '''
          if text.count(old) != 1:
              raise SystemExit(f'metrics result marker count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            }, {
                              {"name",  "n_tokens_max"},
                              {"help",  "Largest observed n_tokens."},
                              {"value",  res_task->n_tokens_max}
                      }}},
          '''
          new = '''            }, {
                              {"name",  "n_tokens_max"},
                              {"help",  "Largest observed n_tokens."},
                              {"value",  res_task->n_tokens_max}
                      }, {
                              {"name",  "moe_weight_copy_bytes_total"},
                              {"help",  "Selective routed-expert weight bytes copied to an accelerator, including padding."},
                              {"value",  moe_copy_stats.weight_copy_bytes}
                      }, {
                              {"name",  "moe_weight_payload_bytes_total"},
                              {"help",  "Selective routed-expert weight payload bytes copied to an accelerator."},
                              {"value",  moe_copy_stats.weight_payload_bytes}
                      }, {
                              {"name",  "moe_expert_slices_copied_total"},
                              {"help",  "Logical routed-expert weight slices copied to an accelerator."},
                              {"value",  moe_copy_stats.expert_slices}
                      }, {
                              {"name",  "moe_weight_copy_calls_total"},
                              {"help",  "Grouped selective routed-expert weight copy submissions."},
                              {"value",  moe_copy_stats.copy_calls}
                      }, {
                              {"name",  "moe_weight_inputs_total"},
                              {"help",  "Packed routed-expert weight inputs handled by selective copying."},
                              {"value",  moe_copy_stats.weight_inputs}
                      }, {
                              {"name",  "moe_cpu_mul_mat_id_ops_total"},
                              {"help",  "MUL_MAT_ID nodes executed on CPU backends."},
                              {"value",  moe_exec_stats.cpu_ops}
                      }, {
                              {"name",  "moe_accelerator_mul_mat_id_ops_total"},
                              {"help",  "MUL_MAT_ID nodes executed on accelerator backends."},
                              {"value",  moe_exec_stats.accelerator_ops}
                      }}},
          '''
          if text.count(old) != 1:
              raise SystemExit(f'metrics counter marker count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check

      - name: Configure server compile check
        run: >-
          cmake -S . -B build-server-metrics -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build server
        run: cmake --build build-server-metrics --parallel --target llama-server

      - name: Commit metrics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/server/server-context.cpp
          git commit -m 'server: expose MoE execution and copy metrics'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
