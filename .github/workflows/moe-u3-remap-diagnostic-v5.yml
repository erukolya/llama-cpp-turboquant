name: MoE U3 Remap Diagnostic V5

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-remap-diagnostic-v5.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Apply minimal contiguous-ID candidate
        shell: python
        run: |
          from pathlib import Path
          import re

          test = Path('tests/test-moe-route-remap.cpp')
          text = test.read_text(encoding='utf-8')
          old = '''    ggml_tensor * flat_ids = ggml_reshape_1d(ctx, global_ids, ggml_nelements(global_ids));
              ggml_tensor * local_flat = ggml_get_rows(ctx, route_map, flat_ids);
              ggml_tensor * local_ids = ggml_reshape_2d(ctx, local_flat, n_used, n_tokens);'''
          new = '''    ggml_tensor * selected = ggml_argsort_top_k(ctx, ggml_cast(ctx, global_ids, GGML_TYPE_F32), n_used);
              ggml_tensor * selected_cont = ggml_cont(ctx, selected);
              ggml_tensor * flat_ids = ggml_reshape_1d(ctx, selected_cont, ggml_nelements(selected_cont));
              ggml_tensor * local_flat = ggml_get_rows(ctx, route_map, flat_ids);
              ggml_tensor * local_ids = ggml_reshape_2d(ctx, local_flat, n_used, n_tokens);'''
          if old not in text:
              raise SystemExit('baseline remap block missing')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Configure
        shell: bash
        run: cmake -S . -B build-fast -G Ninja -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF

      - name: Build and test without early exit
        id: diagnostic
        shell: bash
        run: |
          set +e
          {
            echo '=== patched test source ==='
            sed -n '35,100p' tests/test-moe-route-remap.cpp
            echo '=== build output ==='
            cmake --build build-fast -j 2 --target test-moe-route-remap
            build_rc=$?
            echo "build_exit_code=$build_rc"
            test_rc=999
            if [ "$build_rc" -eq 0 ]; then
              echo '=== test output ==='
              ./build-fast/bin/test-moe-route-remap
              test_rc=$?
            fi
            echo "test_exit_code=$test_rc"
          } > .github/moe-u3-remap-v5-diagnostic.log 2>&1
          cat .github/moe-u3-remap-v5-diagnostic.log
          echo "build_rc=$build_rc" >> "$GITHUB_OUTPUT"
          echo "test_rc=$test_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-remap-v5-diagnostic.log
          git commit -m 'ci: record exact MoE remap build diagnostic'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement

      - name: Enforce success
        if: steps.diagnostic.outputs.build_rc != '0' || steps.diagnostic.outputs.test_rc != '0'
        run: exit 1
