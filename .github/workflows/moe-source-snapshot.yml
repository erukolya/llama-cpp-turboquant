name: MoE Source Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-source-snapshot.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/moe-source-snapshot.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Package source
        run: |
          git archive --format=zip --output=agent-source.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: agent-source.zip
          retention-days: 1
