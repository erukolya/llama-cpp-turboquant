name: TurboQuant+ Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/moe-expert-stats'
    tags:
      - 'tqp-v*'
    paths:
      - '.github/workflows/tqp-release.yml'

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

jobs:
  windows-cuda:
    runs-on: windows-2022

    strategy:
      matrix:
        cuda: ['13.3']

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Set package version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "TQP_VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "TQP_VERSION=build-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            ${{ env.CMAKE_ARGS }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item LICENSE ./build/bin/Release/
          $dst = '.\build\bin\Release\'
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{ env.CUDA_PATH }}\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{ env.CUDA_PATH }}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a "turboquant-plus-${{ env.TQP_VERSION }}-windows-x64-cuda${{ matrix.cuda }}.zip" .\build\bin\Release\*

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-cuda${{ matrix.cuda }}
          path: turboquant-plus-${{ env.TQP_VERSION }}-windows-x64-cuda${{ matrix.cuda }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/tqp-v')
    needs: [windows-cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TurboQuant+ ${{ github.ref_name }}
          files: ./release/*
          draft: false
          prerelease: false
