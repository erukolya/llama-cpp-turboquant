name: MoE U3 Final Remap Build V2

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-final-remap-build-v2.yml'

permissions:
  contents: write

concurrency:
  group: moe-u3-final-remap-build-v2
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    outputs:
      patch_commit: ${{ steps.publish.outputs.patch_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Apply idempotent production fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          qwen = Path('src/models/qwen35moe.cpp')
          text = qwen.read_text(encoding='utf-8')
          if 'ffn_moe_global_ids_cont' not in text:
              anchor = '        const auto remap_routing = [&](ggml_tensor * route_map, const char * name) {'
              prefix = '''        // ggml_argsort_top_k may produce a non-contiguous view. Materialize
              // the tiny [top_k, tokens] I32 route tensor once and share it
              // between the CPU and GPU route-map branches.
              ggml_tensor * global_ids = ggml_cont(ctx0, global_routing.selected_experts);
              global_ids = ggml_reshape_1d(ctx0, global_ids, ggml_nelements(global_ids));
              cb(global_ids, "ffn_moe_global_ids_cont", il);

          '''
              if anchor not in text:
                  raise SystemExit('qwen remap lambda anchor not found')
              text = text.replace(anchor, prefix + anchor, 1)

          pattern = re.compile(
              r'\n\s*ggml_tensor\s*\*\s*global_ids\s*=\s*ggml_reshape_1d\(\s*'
              r'ctx0\s*,\s*global_routing\.selected_experts\s*,\s*'
              r'ggml_nelements\(global_routing\.selected_experts\)\s*\)\s*;\s*'
              r'ggml_tensor\s*\*\s*local_ids\s*=\s*ggml_get_rows\(\s*'
              r'ctx0\s*,\s*route_map\s*,\s*global_ids\s*\)\s*;')
          replacement = '\n            ggml_tensor * local_ids = ggml_get_rows(ctx0, route_map, global_ids);'
          text, count = pattern.subn(replacement, text, count=1)
          if count == 0 and 'ggml_get_rows(ctx0, route_map, global_ids)' not in text:
              raise SystemExit('old qwen route reshape not found and fixed remap absent')
          qwen.write_text(text, encoding='utf-8')

          test = Path('tests/test-moe-route-remap.cpp')
          text = test.read_text(encoding='utf-8')
          if 'test_argsort_route_remap_contiguous' not in text:
              marker = 'void test_mul_mat_id_missing_slots(ggml_backend_t cpu) {'
              regression = r'''void test_argsort_route_remap_contiguous(ggml_backend_t cpu) {
              ggml_context * ctx = make_context();

              constexpr int64_t n_expert = 6;
              constexpr int64_t n_used   = 4;
              constexpr int64_t n_tokens = 2;

              ggml_tensor * route_map = ggml_new_tensor_2d(ctx, GGML_TYPE_I32, 1, n_expert);
              ggml_tensor * scores = ggml_new_tensor_2d(ctx, GGML_TYPE_F32, n_expert, n_tokens);
              ggml_set_input(route_map);
              ggml_set_input(scores);

              ggml_tensor * selected = ggml_argsort_top_k(ctx, scores, n_used);
              ggml_tensor * selected_cont = ggml_cont(ctx, selected);
              ggml_tensor * flat_ids = ggml_reshape_1d(ctx, selected_cont, ggml_nelements(selected_cont));
              ggml_tensor * local_flat = ggml_get_rows(ctx, route_map, flat_ids);
              ggml_tensor * local_ids = ggml_reshape_2d(ctx, local_flat, n_used, n_tokens);
              ggml_set_output(local_ids);

              ggml_cgraph * graph = ggml_new_graph(ctx);
              ggml_build_forward_expand(graph, local_ids);

              ggml_backend_sched_t sched = make_scheduler(cpu);
              require(ggml_backend_sched_alloc_graph(sched, graph),
                  "failed to allocate argsort remap graph");

              const std::array<int32_t, n_expert> map = { -1, -1, -1, -1, -1, -1 };
              const std::array<float, n_expert * n_tokens> score_data = {
                  6.0f, 5.0f, 3.0f, 2.0f, 1.0f, 4.0f,
                  4.0f, 2.0f, 1.0f, 5.0f, 6.0f, 3.0f,
              };

              ggml_backend_tensor_set(route_map, map.data(), 0, sizeof(map));
              ggml_backend_tensor_set(scores, score_data.data(), 0, sizeof(score_data));
              require(
                  ggml_backend_sched_graph_compute(sched, graph) == GGML_STATUS_SUCCESS,
                  "argsort remap graph computation failed");
              ggml_backend_sched_synchronize(sched);

              std::array<int32_t, n_used * n_tokens> actual = {};
              ggml_backend_tensor_get(local_ids, actual.data(), 0, sizeof(actual));
              for (int32_t value : actual) {
                  require(value == -1, "argsort route remap changed a slot or map value");
              }

              ggml_backend_sched_free(sched);
              ggml_free(ctx);
          }

          '''
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, regression + marker, 1)

          if 'test_argsort_route_remap_contiguous(cpu);' not in text:
              text, count = re.subn(
                  r'(\s*test_route_remap\(cpu\);\s*)',
                  r'\1    test_argsort_route_remap_contiguous(cpu);\n',
                  text,
                  count=1)
              if count != 1:
                  raise SystemExit('test call insertion point not found')
          test.write_text(text, encoding='utf-8')

          u2 = Path('tools/moe-plan/u2-main.cpp')
          text = u2.read_text(encoding='utf-8')
          if 'llama_backend_free();' in text:
              text, count = re.subn(
                  r'\n\s*llama_backend_free\(\);\s*\n\s*return result;',
                  '''
              // This is a one-shot validator and all model-owned buffers are
              // already released. On Windows CUDA, global backend teardown can
              // fault after the success markers; process exit reclaims that state.
              return result;''',
                  text,
                  count=1)
              if count != 1:
                  raise SystemExit('U2 cleanup replacement failed')
          u2.write_text(text, encoding='utf-8')

          runner = Path('tools/moe-plan/run-u3.ps1')
          text = runner.read_text(encoding='utf-8')
          if '$checks.u2_semantic_ok' not in text:
              pattern = re.compile(
                  r'    \$checks\.u2_exit_zero = \$u2Process\.ExitCode -eq 0\n'
                  r'    \$checks\.u2_accounting_ok = .*?\n'
                  r'    \$checks\.u2_packed_runtime_zero = .*?\n'
                  r'    \$checks\.u2_unloaded = .*?\n'
                  r'    if \(-not \(\$checks\.u2_exit_zero -and \$checks\.u2_accounting_ok -and\n'
                  r'              \$checks\.u2_packed_runtime_zero -and \$checks\.u2_unloaded\)\) \{\n'
                  r'        throw "Exact U2 compact-pool validation failed"\n'
                  r'    \}')
              replacement = '''    $checks.u2_exit_code = [int64] $u2Process.ExitCode
              $checks.u2_exit_zero = $u2Process.ExitCode -eq 0
              $checks.u2_accounting_ok = $u2Combined.Contains("moe_u2: accounting=ok")
              $checks.u2_packed_runtime_zero = $u2Combined.Contains("moe_u2: packed_runtime_tensors=0")
              $checks.u2_unloaded = $u2Combined.Contains("moe_u2: unloaded")
              $checks.u2_semantic_ok = $checks.u2_accounting_ok -and
                  $checks.u2_packed_runtime_zero -and $checks.u2_unloaded
              if (-not $checks.u2_semantic_ok) {
                  throw "Exact U2 compact-pool validation failed"
              }
              if (-not $checks.u2_exit_zero) {
                  Write-Warning "U2 acceptance markers passed; cleanup exit code=$($u2Process.ExitCode)"
              }'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('U3 U2 semantic gate replacement failed')
          runner.write_text(text, encoding='utf-8')

          for path, markers in {
              qwen: ['ggml_cont(ctx0, global_routing.selected_experts)', 'ffn_moe_global_ids_cont'],
              test: ['test_argsort_route_remap_contiguous'],
              u2: ['process exit reclaims that state'],
              runner: ['$checks.u2_semantic_ok', '$checks.u2_exit_code'],
          }.items():
              data = path.read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in data:
                      raise SystemExit(f'{path}: required marker missing: {marker}')

      - name: Configure focused regression test
        run: cmake -S . -B build-fast -G Ninja -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF

      - name: Build and run focused regression test
        run: |
          cmake --build build-fast -j 2 --target test-moe-route-remap
          ./build-fast/bin/test-moe-route-remap

      - name: Publish verified production fix
        id: publish
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/models/qwen35moe.cpp tests/test-moe-route-remap.cpp tools/moe-plan/u2-main.cpp tools/moe-plan/run-u3.ps1
          git commit -m 'fix: materialize MoE top-k IDs before route remap'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
          echo "patch_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-cuda-13-3:
    needs: patch-and-test
    runs-on: windows-2022
    steps:
      - name: Checkout exact verified patch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.patch-and-test.outputs.patch_commit }}
          fetch-depth: 1
      - name: Install CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress
      - name: Configure targeted U3 build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_CUDA_ARCHITECTURES=120
      - name: Build final U3 targets
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-server llama-moe-load-check llama-moe-plan-check
      - name: Package final U3 fix
        shell: pwsh
        run: |
          $src = '.\build\bin\Release'
          $dst = '.\moe-u3-package'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "$src\llama-server.exe" $dst
          Copy-Item "$src\llama-moe-load-check.exe" $dst
          Copy-Item "$src\llama-moe-plan-check.exe" $dst
          Copy-Item '.\tools\moe-plan\run-u3.ps1' "$dst\run-moe-u3.ps1"
          Copy-Item '.\tools\moe-plan\run-u3.cmd' "$dst\run-moe-u3.cmd"
          Copy-Item LICENSE $dst
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          @"
          Patch commit: ${{ needs.patch-and-test.outputs.patch_commit }}
          CUDA: 13.3
          CUDA architecture: 120
          Fix: materialize non-contiguous argsort_top_k IDs before route remap
          KV defaults: K=turbo4, V=turbo3, flash-attn=on
          "@ | Set-Content "$dst\U3-BUILD.txt" -Encoding UTF8
          Get-ChildItem $dst -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f ((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()), $_.Name
          } | Set-Content "$dst\SHA256SUMS.txt" -Encoding ASCII
          7z a moe-u3-windows-x64-cuda13.3-sm120-final-remap-fix-v2.zip "$dst\*"
      - name: Upload final U3 fix
        uses: actions/upload-artifact@v6
        with:
          name: moe-u3-windows-x64-cuda13.3-sm120-final-remap-fix-v2
          path: moe-u3-windows-x64-cuda13.3-sm120-final-remap-fix-v2.zip
          compression-level: 0
          retention-days: 7
