name: Release (Windows CPU + CUDA 13.3)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release after building
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CMAKE_ARGS: >-
    -DLLAMA_BUILD_EXAMPLES=OFF
    -DLLAMA_BUILD_TESTS=OFF
    -DLLAMA_BUILD_TOOLS=ON
    -DLLAMA_BUILD_SERVER=ON
    -DGGML_RPC=ON

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  windows-cpu:
    name: Windows x64 CPU
    runs-on: windows-2025-vs2026

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ui/package-lock.json

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-windows-x64-cpu

      - name: Build CPU package
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            %CMAKE_ARGS%
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Add runtime files
        shell: pwsh
        run: |
          Copy-Item LICENSE .\build\bin\Release\

          $libomp = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Redist\MSVC" `
            -Recurse `
            -Filter "libomp140.x86_64.dll" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($libomp) {
            Copy-Item $libomp.FullName .\build\bin\Release\
          } else {
            throw "libomp140.x86_64.dll was not found"
          }

      - name: Pack CPU artifact
        shell: pwsh
        run: 7z a -snl llama-bin-win-cpu-x64.zip .\build\bin\Release\*

      - name: Upload CPU artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-bin-win-cpu-x64.zip
          path: llama-bin-win-cpu-x64.zip
          if-no-files-found: error

  windows-cuda:
    name: Windows x64 CUDA 13.3 backend
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.3"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-windows-x64-cuda-13.3

      - name: Build CUDA backend
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Pack CUDA backend and runtime
        shell: pwsh
        run: |
          $dst = New-Item -ItemType Directory -Force -Path .\cuda-package
          Copy-Item .\build\bin\Release\ggml-cuda.dll $dst.FullName

          $patterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll"
          )

          $roots = @(
            "$env:CUDA_PATH\bin",
            "$env:CUDA_PATH\lib",
            "$env:CUDA_PATH\bin\x64"
          ) | Where-Object { Test-Path $_ }

          foreach ($pattern in $patterns) {
            $files = foreach ($root in $roots) {
              Get-ChildItem $root -Filter $pattern -File -ErrorAction SilentlyContinue
            }

            $files = $files | Sort-Object Name -Unique
            if (-not $files) {
              throw "CUDA runtime file matching '$pattern' was not found under CUDA_PATH"
            }

            foreach ($file in $files) {
              Copy-Item $file.FullName $dst.FullName -Force
            }
          }

          7z a -snl llama-bin-win-cuda-13.3-x64-backend.zip .\cuda-package\*

      - name: Upload CUDA backend artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-bin-win-cuda-13.3-x64-backend.zip
          path: llama-bin-win-cuda-13.3-x64-backend.zip
          if-no-files-found: error

  release:
    name: Create Windows release
    if: ${{ inputs.create_release }}
    needs:
      - windows-cpu
      - windows-cuda
    runs-on: ubuntu-slim
    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.tag.outputs.name }}

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifact
          merge-multiple: true

      - name: Assemble final archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/cpu package/cuda release

          unzip artifact/llama-bin-win-cpu-x64.zip -d package/cpu
          cp -a package/cpu/. package/cuda/
          unzip -o artifact/llama-bin-win-cuda-13.3-x64-backend.zip -d package/cuda

          (
            cd package/cpu
            zip -r ../../release/llama-${{ steps.tag.outputs.name }}-bin-win-cpu-x64.zip .
          )

          (
            cd package/cuda
            zip -r ../../release/llama-${{ steps.tag.outputs.name }}-bin-win-cuda-13.3-x64.zip .
          )

      - name: Create release
        id: create_release
        uses: ggml-org/action-create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            Windows x64 builds for this fork.

            - CPU: `llama-${{ steps.tag.outputs.name }}-bin-win-cpu-x64.zip`
            - NVIDIA CUDA 13.3: `llama-${{ steps.tag.outputs.name }}-bin-win-cuda-13.3-x64.zip`

            The CUDA archive is self-contained: it includes the Windows CPU binaries, `ggml-cuda.dll`, and the required CUDA runtime DLLs.

      - name: Upload release assets
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = '${{ steps.create_release.outputs.id }}';

            for (const file of fs.readdirSync('./release')) {
              const fullPath = path.join('./release', file);
              console.log('uploadReleaseAsset', file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: file,
                data: fs.readFileSync(fullPath),
              });
            }
