name: Prepare exact Windows release matrix commit

on:
  pull_request:
    types: [synchronize]
    branches:
      - feature/turboquant-kv-cache
    paths:
      - '.github/workflows/apply-release-matrix-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.head_ref == 'agent/moe-expert-stats' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/moe-expert-stats
          fetch-depth: 0

      - name: Apply only the two requested matrix edits
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text(encoding='utf-8')

          old_cpu = "          - arch: 'x64'\n          - arch: 'arm64'\n"
          new_cpu = "          - arch: 'x64'\n"
          old_cuda = "        cuda: ['12.4', '13.3']\n"
          new_cuda = "        cuda: ['13.3']\n"

          assert text.count(old_cpu) == 1, text.count(old_cpu)
          assert text.count(old_cuda) == 1, text.count(old_cuda)

          text = text.replace(old_cpu, new_cpu, 1)
          text = text.replace(old_cuda, new_cuda, 1)
          path.write_text(text, encoding='utf-8', newline='')

      - name: Verify exact release diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --numstat -- .github/workflows/release.yml)" = $'1\t2\t.github/workflows/release.yml'
          git diff --check
          git diff -- .github/workflows/release.yml
          git diff -- .github/workflows/release.yml | grep -F -- "-          - arch: 'arm64'"
          git diff -- .github/workflows/release.yml | grep -F -- "-        cuda: ['12.4', '13.3']"
          git diff -- .github/workflows/release.yml | grep -F -- "+        cuda: ['13.3']"

      - name: Create unreferenced commit object
        id: prepare
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = cp.execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();
            const headTree = cp.execSync('git rev-parse HEAD^{tree}', { encoding: 'utf8' }).trim();
            const content = fs.readFileSync('.github/workflows/release.yml').toString('base64');

            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content,
              encoding: 'base64',
            });

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headTree,
              tree: [
                {
                  path: '.github/workflows/release.yml',
                  mode: '100644',
                  type: 'blob',
                  sha: blob.data.sha,
                },
                {
                  path: '.github/workflows/server.yml',
                  mode: '100644',
                  type: 'blob',
                  sha: '5a02cc15ad5e00be33934dc353f4da1f3eaed937',
                },
                {
                  path: '.github/workflows/apply-release-matrix-once.yml',
                  mode: '100644',
                  type: 'blob',
                  sha: null,
                },
              ],
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'ci: limit Windows release matrix',
              tree: tree.data.sha,
              parents: [headSha],
            });

            fs.writeFileSync('prepared-commit.txt', `${commit.data.sha}\n`);
            fs.writeFileSync('prepared-tree.txt', `${tree.data.sha}\n`);
            core.notice(`Prepared commit: ${commit.data.sha}`);

      - name: Upload prepared commit metadata
        uses: actions/upload-artifact@v6
        with:
          name: prepared-release-matrix-commit
          path: |
            prepared-commit.txt
            prepared-tree.txt
          if-no-files-found: error
