name: Apply MoE MUL_MAT_ID Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/moe-apply-sentinel.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply guarded sentinel support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          MAGIC = '0x4D4F4553'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          cpu = 'ggml/src/ggml-cpu/ggml-cpu.c'
          replace_once(cpu,
          '''    const int n_ids = ids->ne[0]; // n_expert_used
              const int n_as  = ne02;       // n_expert

              void * wdata_cur = params->wdata;
          ''',
          f'''    const int n_ids = ids->ne[0]; // n_expert_used
              const int n_as  = ne02;       // n_expert

              // Split MoE branches preserve top-k slots with -1 for experts owned by
              // the other backend. Stock MUL_MAT_ID tensors leave this parameter zero.
              const bool allow_negative_ids = dst->op_params[0] == {MAGIC};

              void * wdata_cur = params->wdata;
          ''')
          replace_once(cpu,
          '''    if (ith == 0) {
                  // initialize matrix_row_counts
                  memset(matrix_row_counts, 0, n_as*sizeof(int64_t));
          ''',
          '''    if (ith == 0) {
                  if (allow_negative_ids) {
                      memset(dst->data, 0, ggml_nbytes(dst));
                  }

                  // initialize matrix_row_counts
                  memset(matrix_row_counts, 0, n_as*sizeof(int64_t));
          ''')
          replace_once(cpu,
          '''                assert(i02 >= 0 && i02 < n_as);

                          MMID_MATRIX_ROW(i02, matrix_row_counts[i02]) = (struct mmid_row_mapping) {id, iid1};
          ''',
          '''                if (allow_negative_ids && i02 < 0) {
                              GGML_ASSERT(i02 == -1);
                              continue;
                          }
                          GGML_ASSERT(i02 >= 0 && i02 < n_as);

                          MMID_MATRIX_ROW(i02, matrix_row_counts[i02]) = (struct mmid_row_mapping) {id, iid1};
          ''')

          repack = 'ggml/src/ggml-cpu/repack.cpp'
          replace_once(repack,
          '''        const int n_ids = ids->ne[0]; // n_expert_used
                  const int n_as  = ne02;       // n_expert

                  const size_t nbw1 = ggml_row_size(PARAM_TYPE, ne10);
          ''',
          f'''        const int n_ids = ids->ne[0]; // n_expert_used
                  const int n_as  = ne02;       // n_expert

                  // See the generic CPU kernel for the guarded -1 split-slot contract.
                  const bool allow_negative_ids = op->op_params[0] == {MAGIC};

                  const size_t nbw1 = ggml_row_size(PARAM_TYPE, ne10);
          ''')
          replace_once(repack,
          '''        if (ith == 0) {
                      // initialize matrix_row_counts
                      memset(matrix_row_counts, 0, n_as * sizeof(int64_t));
          ''',
          '''        if (ith == 0) {
                      if (allow_negative_ids) {
                          memset(dst->data, 0, ggml_nbytes(dst));
                      }

                      // initialize matrix_row_counts
                      memset(matrix_row_counts, 0, n_as * sizeof(int64_t));
          ''')
          replace_once(repack,
          '''                    GGML_ASSERT(i02 >= 0 && i02 < n_as);

                              MMID_MATRIX_ROW(i02, matrix_row_counts[i02]) = { id, iid1 };
          ''',
          '''                    if (allow_negative_ids && i02 < 0) {
                                  GGML_ASSERT(i02 == -1);
                                  continue;
                              }
                              GGML_ASSERT(i02 >= 0 && i02 < n_as);

                              MMID_MATRIX_ROW(i02, matrix_row_counts[i02]) = { id, iid1 };
          ''')

          mmid = 'ggml/src/ggml-cuda/mmid.cu'
          replace_count(mmid,
              'nex_prev += expert_used < expert;',
              'nex_prev += expert_used >= 0 && expert_used < expert;',
              2)

          cuda = 'ggml/src/ggml-cuda/ggml-cuda.cu'
          replace_once(cuda,
          '''    const int cc = ggml_cuda_info().devices[ggml_cuda_get_device()].cc;

              // [TAG_MUL_MAT_ID_CUDA_GRAPHS]
          ''',
          f'''    const int cc = ggml_cuda_info().devices[ggml_cuda_get_device()].cc;
              cudaStream_t stream = ctx.stream();

              // Split MoE branches use -1 for top-k slots owned by the other backend.
              // The magic keeps stock MUL_MAT_ID behavior and performance unchanged.
              const bool allow_negative_ids = dst->op_params[0] == {MAGIC};
              if (allow_negative_ids) {{
                  CUDA_CHECK(cudaMemsetAsync(dst->data, 0, ggml_nbytes(dst), stream));
              }}

              // [TAG_MUL_MAT_ID_CUDA_GRAPHS]
          ''')
          replace_once(cuda,
          '''    // note: this path should not be reached when recording CUDA graphs, because it requires stream synchronization
              // TODO: add asserts to verify this. should work with CUDA, HIP, etc.
              cudaStream_t stream = ctx.stream();

              GGML_ASSERT(nb12 % nb11 == 0);
          ''',
          '''    // note: this path should not be reached when recording CUDA graphs, because it requires stream synchronization
              // TODO: add asserts to verify this. should work with CUDA, HIP, etc.

              GGML_ASSERT(nb12 % nb11 == 0);
          ''')
          replace_once(cuda,
          '''    std::vector<int32_t> ids_to_sorted_host;
              ids_to_sorted_host.reserve(2*ne_get_rows);
              std::vector<int32_t> ids_from_sorted_host(ne_get_rows);

              ggml_cuda_pool_alloc<int32_t> ids_buf_dev(ctx.pool(), 2*ne_get_rows);

              std::vector<int32_t> tokens_per_expert(ne02);

              ggml_cuda_pool_alloc<char> src1_sorted(ctx.pool(), ne12*n_expert_used*ne10*ts_src1_sorted);
              ggml_cuda_pool_alloc<char>  dst_sorted(ctx.pool(), ne2 *n_expert_used* ne0*ts_dst_sorted);
          ''',
          '''    std::vector<int32_t> ids_to_sorted_host(ne_get_rows, 0);
              std::vector<int32_t> ids_from_sorted_host(ne_get_rows, -1);
              int64_t n_valid_rows = 0;

              ggml_cuda_pool_alloc<int32_t> ids_buf_dev(ctx.pool(), 2*ne_get_rows);

              std::vector<int32_t> tokens_per_expert(ne02);

              ggml_cuda_pool_alloc<char> src1_sorted(ctx.pool(), ne12*n_expert_used*ne10*ts_src1_sorted);
              ggml_cuda_pool_alloc<char>  dst_sorted(ctx.pool(), (ne2*n_expert_used + (allow_negative_ids ? 1 : 0))*ne0*ts_dst_sorted);
          ''')
          replace_once(cuda,
          '''                const int32_t expert_to_use = *(const int32_t *)(ids_host.data() + i12*ids->nb[1] + iex*ids->nb[0]);
                          assert(expert_to_use >= 0 && expert_to_use < ne02);
                          if (expert_to_use == i02) {
                              ids_from_sorted_host[i12*n_expert_used + iex] = ids_to_sorted_host.size();
                              ids_to_sorted_host.push_back(i12*ne11 + iex % ne11);
                              tokens_per_expert[i02]++;
                              break;
                          }
          ''',
          '''                const int32_t expert_to_use = *(const int32_t *)(ids_host.data() + i12*ids->nb[1] + iex*ids->nb[0]);
                          if (expert_to_use < 0) {
                              GGML_ASSERT(allow_negative_ids && expert_to_use == -1);
                              continue;
                          }
                          GGML_ASSERT(expert_to_use < ne02);
                          if (expert_to_use == i02) {
                              ids_from_sorted_host[i12*n_expert_used + iex] = n_valid_rows;
                              ids_to_sorted_host[n_valid_rows++] = i12*ne11 + iex % ne11;
                              tokens_per_expert[i02]++;
                              break;
                          }
          ''')
          replace_once(cuda,
          '''    GGML_ASSERT(ids_to_sorted_host.size() == size_t(ne_get_rows));

              ids_to_sorted_host.insert(ids_to_sorted_host.end(), ids_from_sorted_host.begin(), ids_from_sorted_host.end());

              CUDA_CHECK(cudaMemcpyAsync(ids_buf_dev.ptr, ids_to_sorted_host.data(), 2*ne_get_rows*sizeof(int32_t), cudaMemcpyHostToDevice, stream));
              CUDA_CHECK(cudaStreamSynchronize(stream));
          ''',
          '''    GGML_ASSERT(allow_negative_ids || n_valid_rows == ne_get_rows);
              if (n_valid_rows == 0) {
                  return;
              }

              if (allow_negative_ids) {
                  for (int32_t & index : ids_from_sorted_host) {
                      if (index < 0) {
                          index = n_valid_rows; // zero row appended after valid sorted rows
                      }
                  }
              }

              ids_to_sorted_host.insert(ids_to_sorted_host.end(), ids_from_sorted_host.begin(), ids_from_sorted_host.end());

              CUDA_CHECK(cudaMemcpyAsync(ids_buf_dev.ptr, ids_to_sorted_host.data(), 2*ne_get_rows*sizeof(int32_t), cudaMemcpyHostToDevice, stream));
              CUDA_CHECK(cudaStreamSynchronize(stream));
          ''')
          replace_once(cuda,
          '''        ne_get_rows, 1, 1, sizeof(int32_t), ne_get_rows*sizeof(int32_t), ne_get_rows*sizeof(int32_t),
                  ne10*ts_src1_sorted, ne_get_rows*ne10*ts_src1_sorted, ne_get_rows*ne10*ts_src1_sorted, stream);
          ''',
          '''        n_valid_rows, 1, 1, sizeof(int32_t), ne_get_rows*sizeof(int32_t), ne_get_rows*sizeof(int32_t),
                  ne10*ts_src1_sorted, n_valid_rows*ne10*ts_src1_sorted, n_valid_rows*ne10*ts_src1_sorted, stream);
          ''')
          replace_once(cuda,
          '''    get_rows_cuda(dst_sorted.ptr, type_dst_sorted, ids_from_sorted, dst->data, dst->type,
                  ne0, ne0*ts_dst_sorted, ne_get_rows*ne0*ts_dst_sorted, ne_get_rows*ne0*ts_dst_sorted,
                  ne_get_rows, 1, 1, sizeof(int32_t), ne_get_rows*sizeof(int32_t), ne_get_rows*sizeof(int32_t),
                  nb1, nb2, nb3, stream);
          ''',
          '''    const int64_t n_sorted_rows = n_valid_rows + (allow_negative_ids ? 1 : 0);
              if (allow_negative_ids) {
                  CUDA_CHECK(cudaMemsetAsync(
                      dst_sorted.ptr + n_valid_rows*ne0*ts_dst_sorted,
                      0,
                      ne0*ts_dst_sorted,
                      stream));
              }

              get_rows_cuda(dst_sorted.ptr, type_dst_sorted, ids_from_sorted, dst->data, dst->type,
                  ne0, ne0*ts_dst_sorted, n_sorted_rows*ne0*ts_dst_sorted, n_sorted_rows*ne0*ts_dst_sorted,
                  ne_get_rows, 1, 1, sizeof(int32_t), ne_get_rows*sizeof(int32_t), ne_get_rows*sizeof(int32_t),
                  nb1, nb2, nb3, stream);
          ''')
          PY

          git diff --check

      - name: Configure CPU compile check
        run: >-
          cmake -S . -B build-sentinel -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build CPU model loader
        run: cmake --build build-sentinel --parallel --target llama-moe-load-check

      - name: Commit backend support
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ggml/src/ggml-cpu/ggml-cpu.c ggml/src/ggml-cpu/repack.cpp ggml/src/ggml-cuda/mmid.cu ggml/src/ggml-cuda/ggml-cuda.cu
          git commit -m 'ggml: support guarded negative MoE route slots'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
