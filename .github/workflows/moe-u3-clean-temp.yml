name: Clean Temporary MoE U3 Diagnostics

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-clean-temp.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0
      - name: Remove temporary workflows and status files
        shell: bash
        run: |
          git pull --rebase origin agent/static-moe-expert-placement
          rm -f \
            .github/moe-u3-final-remap-build-runs.json \
            .github/moe-u3-final-remap-build-v2-runs.json \
            .github/moe-u3-remap-diagnostic-v5-runs.json \
            .github/moe-u3-remap-fix-runs.json \
            .github/moe-u3-remap-fix-v3-runs.json \
            .github/moe-u3-remap-fix-v4-runs.json \
            .github/moe-u3-remap-log-tail-runs.json \
            .github/moe-u3-remap-regression-tail.log \
            .github/moe-u3-remap-regression-v3.log \
            .github/moe-u3-remap-compiler-errors.log \
            .github/moe-u3-remap-v5-test.log \
            .github/moe-u3-remap-v5-diagnostic.log \
            .github/workflows/moe-u3-final-remap-build-v2.yml \
            .github/workflows/moe-u3-final-remap-build.yml \
            .github/workflows/moe-u3-fix-u2-cleanup.yml \
            .github/workflows/moe-u3-remap-diagnostic-v5.yml \
            .github/workflows/moe-u3-remap-fix-build-v3.yml \
            .github/workflows/moe-u3-remap-fix-build-v4.yml \
            .github/workflows/moe-u3-remap-fix-build.yml \
            .github/workflows/moe-u3-remap-fix-locator.yml \
            .github/workflows/moe-u3-remap-log-tail.yml \
            .github/workflows/moe-u3-clean-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: remove temporary U3 diagnostic workflows'
          git push origin HEAD:agent/static-moe-expert-placement
