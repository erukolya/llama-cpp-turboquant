name: MoE U3 Final Repack

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-repack-final.yml'

permissions:
  actions: read
  contents: write

jobs:
  repack:
    runs-on: windows-2025
    steps:
      - name: Checkout current runner
        uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Download successful U3 build
        uses: actions/download-artifact@v7
        with:
          name: moe-u3-windows-x64-cuda13.3-sm120
          repository: erukolya/llama-cpp-turboquant
          run-id: 30339798181
          github-token: ${{ github.token }}
          path: incoming

      - name: Repack with current TurboQuant runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $innerZip = Join-Path $PWD 'incoming\moe-u3-windows-x64-cuda13.3-sm120.zip'
          if (-not (Test-Path -LiteralPath $innerZip -PathType Leaf)) {
              Write-Host 'Downloaded artifact contents:'
              Get-ChildItem -LiteralPath incoming -Recurse | Format-Table FullName, Length
              throw "Expected inner package not found: $innerZip"
          }

          $package = Join-Path $PWD 'final-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Expand-Archive -LiteralPath $innerZip -DestinationPath $package -Force

          Copy-Item '.\tools\moe-plan\run-u3.ps1' (Join-Path $package 'run-moe-u3.ps1') -Force
          Copy-Item '.\tools\moe-plan\run-u3.cmd' (Join-Path $package 'run-moe-u3.cmd') -Force

          $required = @(
              'llama-server.exe',
              'llama-moe-load-check.exe',
              'llama-moe-plan-check.exe',
              'run-moe-u3.ps1',
              'run-moe-u3.cmd',
              'LICENSE'
          )
          foreach ($name in $required) {
              $path = Join-Path $package $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Final U3 package is missing $name"
              }
          }

          $runner = Get-Content (Join-Path $package 'run-moe-u3.ps1') -Raw -Encoding UTF8
          foreach ($marker in @(
              '[string] $CacheTypeK = "turbo4"',
              '[string] $CacheTypeV = "turbo3"',
              '"--flash-attn", "on"',
              'moe_cpu_mul_mat_id_ops_total',
              'moe_accelerator_mul_mat_id_ops_total',
              'moe_weight_copy_bytes_total'
          )) {
              if (-not $runner.Contains($marker)) {
                  throw "Final U3 runner marker missing: $marker"
              }
          }

          @"
          Branch: agent/static-moe-expert-placement
          Binary source run: 30339798181
          Binary source commit: 601163ec2ec76901eb5684efede37e9fbf580ed8
          Runner source commit: ${{ github.sha }}
          CUDA: 13.3
          CUDA architecture: 120
          KV defaults: K=turbo4, V=turbo3, flash-attn=on
          Purpose: U3 end-to-end Q4_K_M and Q5_K_M static mixed CPU/CUDA validation

          Run from this directory:
          .\run-moe-u3.cmd -Model "B:\path\model.gguf" -Plan "B:\path\matching-static-plan.json"

          Return the generated moe-u3-result-*.zip file.
          "@ | Set-Content (Join-Path $package 'U3-BUILD.txt') -Encoding UTF8

          $manifest = Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object {
              [ordered]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          }
          $report = [ordered]@{
              created_at_utc = [DateTime]::UtcNow.ToString('o')
              source_run = 30339798181
              source_artifact = 8681328277
              source_binary_commit = '601163ec2ec76901eb5684efede37e9fbf580ed8'
              runner_commit = '${{ github.sha }}'
              cuda = '13.3'
              cuda_architecture = '120'
              cache_type_k = 'turbo4'
              cache_type_v = 'turbo3'
              flash_attention = $true
              files = $manifest
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content '.\docs\moe-u3-package-manifest.json' -Encoding UTF8
          Copy-Item '.\docs\moe-u3-package-manifest.json' (Join-Path $package 'moe-u3-package-manifest.json') -Force

          $finalZip = Join-Path $PWD 'moe-u3-windows-x64-cuda13.3-sm120-final.zip'
          if (Test-Path -LiteralPath $finalZip) { Remove-Item -LiteralPath $finalZip -Force }
          & 7z a -tzip -mx=5 $finalZip (Join-Path $package '*')
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }

          $finalHash = (Get-FileHash -LiteralPath $finalZip -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content '.\docs\moe-u3-package-manifest.json' "`n"
          Set-Content '.\docs\moe-u3-final-package.sha256' "$finalHash  moe-u3-windows-x64-cuda13.3-sm120-final.zip`n" -Encoding ASCII

      - name: Upload final U3 package
        uses: actions/upload-artifact@v6
        with:
          name: moe-u3-windows-x64-cuda13.3-sm120-final
          path: moe-u3-windows-x64-cuda13.3-sm120-final.zip
          compression-level: 0
          retention-days: 7

      - name: Record verified package manifest
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/moe-u3-package-manifest.json docs/moe-u3-final-package.sha256
          git commit -m 'docs: record final U3 package manifest'
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
