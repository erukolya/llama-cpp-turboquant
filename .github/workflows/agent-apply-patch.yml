name: Agent Apply Patch

on:
  push:
    branches:
      - 'agent/static-moe-expert-placement'
    paths:
      - '.github/workflows/agent-apply-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/static-moe-expert-placement

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index agent-patches/moe-exec-stats.patch
          git rm agent-patches/moe-exec-stats.patch
          git commit -m "Instrument MoE execution backends"
          git push origin HEAD:agent/static-moe-expert-placement
