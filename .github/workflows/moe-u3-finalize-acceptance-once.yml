name: MoE U3 Finalize Acceptance

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-finalize-acceptance-once.yml'

permissions:
  contents: write

concurrency:
  group: moe-u3-finalize-acceptance
  cancel-in-progress: true

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'ci: run final U3 acceptance v2' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record active run
        shell: bash
        run: |
          cat > .github/moe-u3-finalize-status.json <<EOF
          {
            "status": "in_progress",
            "run_id": ${{ github.run_id }},
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "head_sha": "${{ github.sha }}"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-finalize-status.json
          git commit -m "ci: record active U3 finalization ${{ github.run_id }}"
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement

      - name: Apply final acceptance patch
        run: python tools/moe-plan/finalize_u3_acceptance.py

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $text = Get-Content .\tools\moe-plan\run-u3.ps1 -Raw -Encoding UTF8
          $null = [scriptblock]::Create($text)
          if ($text -notmatch 'baseline_first_unit_match') {
            throw 'missing first-unit acceptance rule'
          }
          if ($text -notmatch 'static_compact_loaded_log') {
            throw 'missing compact-loader diagnostic rule'
          }

      - name: Publish
        shell: bash
        run: |
          cat > .github/moe-u3-finalize-status.json <<EOF
          {
            "status": "completed",
            "result": "Q4_and_Q5_accepted",
            "q4_static_tokens_per_second": 43.0108,
            "q5_static_tokens_per_second": 39.2157,
            "routed_weight_transfer_bytes": 0
          }
          EOF
          git add tools/moe-plan/run-u3.ps1 docs/moe-expert-placement-progress.md \
            .github/moe-u3-finalize-status.json \
            tools/moe-plan/finalize_u3_acceptance.py \
            .github/workflows/moe-u3-finalize-acceptance-once.yml
          git commit -m "test: accept Q4 and Q5 static MoE hardware results"
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
