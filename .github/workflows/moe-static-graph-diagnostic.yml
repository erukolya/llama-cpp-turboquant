name: MoE Static Graph Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-static-graph-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Apply and validate static mixed graph
        shell: bash
        run: |
          set +e
          rm -f moe-static-graph-error.txt
          {
            python3 .github/scripts/moe_static_graph.py
            git diff --check
            cmake -S . -B build-static-graph -G Ninja \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLAMA_CURL=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_TOOLS=ON \
              -DLLAMA_BUILD_TESTS=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-static-graph --parallel --target \
              llama-moe-load-check \
              test-moe-route-partition \
              test-moe-registry
            ctest --test-dir build-static-graph --output-on-failure \
              -R '^test-moe-(route-partition|registry)$'
          } > moe-static-graph-run.log 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            rm -f moe-static-graph-error.txt
            git add src/llama-model.h src/models/qwen35moe.cpp
            git commit -m 'moe: execute static CPU and GPU expert branches'
          else
            mv moe-static-graph-run.log moe-static-graph-error.txt
            git add moe-static-graph-error.txt
            git commit -m 'ci: capture static mixed graph failure'
          fi

          git push origin HEAD:agent/static-moe-expert-placement
          exit "$status"
