name: MoE Windows Suite Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-windows-remap-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 0

      - name: Configure and build MoE suite
        shell: cmd
        run: >-
          cmake -S . -B build-moe-suite -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake
          -DBUILD_SHARED_LIBS=ON
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          && cmake --build build-moe-suite --config Release --parallel
          --target
          test-moe-load-scope
          test-moe-load-shared
          test-moe-pool-plan
          test-moe-storage
          test-moe-registry
          test-moe-route-partition
          test-moe-route-remap

      - name: Run and record MoE suite result
        shell: pwsh
        run: |
          $log = Join-Path $PWD "moe-windows-suite-result.txt"
          ctest --test-dir build-moe-suite -C Release -VV `
            -R '^test-moe-(load-scope|load-shared|pool-plan|storage|registry|route-partition|route-remap)$' *> $log
          $status = $LASTEXITCODE

          Add-Content $log ""
          Add-Content $log "exit_code=$status"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add moe-windows-suite-result.txt
          if ($status -eq 0) {
              git commit -m "ci: record Windows MoE suite success"
          } else {
              Get-Content $log
              git commit -m "ci: capture Windows MoE suite failure"
          }
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
          exit $status
