name: MoE Windows Remap Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-windows-remap-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Configure and build route remap
        shell: cmd
        run: >-
          cmake -S . -B build-remap -G "Ninja Multi-Config"
          -DCMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake
          -DBUILD_SHARED_LIBS=ON
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          && cmake --build build-remap --config Release --parallel --target test-moe-route-remap

      - name: Run and record route remap result
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build-remap -Recurse -Filter test-moe-route-remap.exe | Select-Object -First 1
          if (-not $exe) { throw "test-moe-route-remap.exe not found" }

          $errorLog = Join-Path $PWD "moe-windows-remap-error.txt"
          $resultLog = Join-Path $PWD "moe-windows-remap-result.txt"
          & $exe.FullName *> $errorLog
          $status = $LASTEXITCODE

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if ($status -eq 0) {
              Remove-Item $errorLog -ErrorAction SilentlyContinue
              "PASS: test-moe-route-remap completed successfully on windows-2025" | Set-Content $resultLog
              git add moe-windows-remap-result.txt
              git commit -m "ci: record Windows MoE remap success"
          } else {
              Get-Content $errorLog
              git add moe-windows-remap-error.txt
              git commit -m "ci: capture Windows MoE remap failure"
          }

          git push origin HEAD:agent/static-moe-expert-placement
          exit $status
