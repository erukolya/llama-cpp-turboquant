name: MoE Graph Refactor Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-graph-refactor-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Apply and validate graph refactor
        shell: bash
        run: |
          set +e
          rm -f moe-graph-refactor-error.txt
          {
            python3 .github/scripts/moe_graph_refactor.py
            git diff --check
            cmake -S . -B build-graph -G Ninja \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLAMA_CURL=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_TOOLS=ON \
              -DLLAMA_BUILD_TESTS=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-graph --parallel --target \
              llama-moe-load-check \
              test-moe-route-partition \
              test-moe-registry
            ctest --test-dir build-graph --output-on-failure \
              -R '^test-moe-(route-partition|registry)$'
          } > moe-graph-refactor-run.log 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            rm -f moe-graph-refactor-error.txt
            git add src/llama-graph.h src/llama-graph.cpp
            git commit -m 'moe: separate routing from expert execution'
          else
            mv moe-graph-refactor-run.log moe-graph-refactor-error.txt
            git add moe-graph-refactor-error.txt
            git commit -m 'ci: capture MoE graph refactor failure'
          fi

          git push origin HEAD:agent/static-moe-expert-placement
          exit "$status"
