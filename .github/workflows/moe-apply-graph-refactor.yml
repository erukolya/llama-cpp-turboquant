name: Apply MoE Graph Refactor

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-apply-graph-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Split MoE routing from execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/llama-graph.h',
          '''struct llm_graph_qkv {
              ggml_tensor * q; // [n_embd_head, n_head,    n_tokens]
              ggml_tensor * k; // [n_embd_head, n_head_kv, n_tokens]
              ggml_tensor * v; // [n_embd_head, n_head_kv, n_tokens]
          };

          struct llm_graph_context {
          ''',
          '''struct llm_graph_qkv {
              ggml_tensor * q; // [n_embd_head, n_head,    n_tokens]
              ggml_tensor * k; // [n_embd_head, n_head_kv, n_tokens]
              ggml_tensor * v; // [n_embd_head, n_head_kv, n_tokens]
          };

          struct llm_graph_moe_routing {
              ggml_tensor * selected_experts = nullptr; // [n_expert_used, n_tokens], global or local IDs
              ggml_tensor * weights = nullptr;          // [1, n_expert_used, n_tokens]
          };

          constexpr int32_t LLM_MOE_MUL_MAT_ID_MISSING_MAGIC = 0x4D4F4553;

          struct llm_graph_context {
          ''')

          replace_once('src/llama-graph.h',
          '''    ggml_tensor * build_lora_mm_id(
                    ggml_tensor * w,   // ggml_tensor * as
                    ggml_tensor * cur, // ggml_tensor * b
                    ggml_tensor * ids) const;
          ''',
          '''    ggml_tensor * build_lora_mm_id(
                    ggml_tensor * w,   // ggml_tensor * as
                    ggml_tensor * cur, // ggml_tensor * b
                    ggml_tensor * ids,
                            bool   allow_missing_ids = false) const;
          ''')

          header = Path('src/llama-graph.h')
          text = header.read_text()
          marker = '''    // build MoE FFN without bias tensors
              ggml_tensor * build_moe_ffn(
          '''
          declarations = '''    llm_graph_moe_routing build_moe_routing(
                   ggml_tensor * cur,
                   ggml_tensor * gate_inp,
                   ggml_tensor * gate_inp_b,
                   ggml_tensor * exp_probs_b,
                       int64_t   n_expert,
                       int64_t   n_expert_used,
                          bool   norm_w,
                         float   w_scale,
              llama_expert_gating_func_type gating_op,
                           int   il,
                   ggml_tensor * probs_in = nullptr) const;

              ggml_tensor * build_moe_ffn_experts(
                   ggml_tensor * cur,
                   ggml_tensor * up_exps,
                   ggml_tensor * up_exps_b,
                   ggml_tensor * gate_exps,
                   ggml_tensor * gate_exps_b,
                   ggml_tensor * down_exps,
                   ggml_tensor * down_exps_b,
                       int64_t   n_expert,
                       int64_t   n_expert_used,
               llm_ffn_op_type   type_op,
                           int   il,
              const llm_graph_moe_routing & routing,
                   ggml_tensor * gate_up_exps = nullptr,
                   ggml_tensor * gate_up_exps_b = nullptr,
                   ggml_tensor * up_exps_s = nullptr,
                   ggml_tensor * gate_exps_s = nullptr,
                   ggml_tensor * down_exps_s = nullptr,
                          bool   allow_missing_ids = false) const;

              // build MoE FFN without bias tensors
              ggml_tensor * build_moe_ffn(
          '''
          if text.count(marker) != 1:
              raise SystemExit('llama-graph.h MoE declaration marker mismatch')
          header.write_text(text.replace(marker, declarations, 1))

          replace_once('src/llama-graph.cpp',
          '''ggml_tensor * llm_graph_context::build_lora_mm_id(
                    ggml_tensor * w,   // ggml_tensor * as
                    ggml_tensor * cur, // ggml_tensor * b
                    ggml_tensor * ids) const {
              ggml_tensor * res = ggml_mul_mat_id(ctx0, w, cur, ids);
              for (const auto & lora : *loras) {
                  llama_adapter_lora_weight * lw = lora.first->get_weight(w);
                  if (lw == nullptr) {
                      continue;
                  }

                  const float alpha = lora.first->alpha;
                  const float rank  = (float) lw->b->ne[0];
                  const float scale = alpha ? lora.second * alpha / rank : lora.second;

                  ggml_tensor * ab_cur = ggml_mul_mat_id(
                          ctx0, lw->b,
                          ggml_mul_mat_id(ctx0, lw->a, cur, ids),
                          ids
                          );

                  ab_cur = ggml_scale(ctx0, ab_cur, scale);
                  res = ggml_add(ctx0, res, ab_cur);
              }

              return res;
          }
          ''',
          '''ggml_tensor * llm_graph_context::build_lora_mm_id(
                    ggml_tensor * w,   // ggml_tensor * as
                    ggml_tensor * cur, // ggml_tensor * b
                    ggml_tensor * ids,
                            bool   allow_missing_ids) const {
              const auto mul_mat_id = [&](ggml_tensor * weight, ggml_tensor * input) {
                  ggml_tensor * result = ggml_mul_mat_id(ctx0, weight, input, ids);
                  if (allow_missing_ids) {
                      const int32_t magic = LLM_MOE_MUL_MAT_ID_MISSING_MAGIC;
                      std::memcpy(result->op_params, &magic, sizeof(magic));
                  }
                  return result;
              };

              ggml_tensor * res = mul_mat_id(w, cur);
              for (const auto & lora : *loras) {
                  llama_adapter_lora_weight * lw = lora.first->get_weight(w);
                  if (lw == nullptr) {
                      continue;
                  }

                  const float alpha = lora.first->alpha;
                  const float rank  = (float) lw->b->ne[0];
                  const float scale = alpha ? lora.second * alpha / rank : lora.second;

                  ggml_tensor * ab_cur = mul_mat_id(lw->b, mul_mat_id(lw->a, cur));

                  ab_cur = ggml_scale(ctx0, ab_cur, scale);
                  res = ggml_add(ctx0, res, ab_cur);
              }

              return res;
          }
          ''')

          cpp = Path('src/llama-graph.cpp')
          text = cpp.read_text()
          needle = '''ggml_tensor * llm_graph_context::build_moe_ffn(
                   ggml_tensor * cur,
                   ggml_tensor * gate_inp,
                   ggml_tensor * gate_inp_b,
          '''
          start = text.find(needle)
          if start < 0 or text.find(needle, start + 1) >= 0:
              raise SystemExit('full build_moe_ffn overload not uniquely found')
          open_brace = text.find('{', start)
          if open_brace < 0:
              raise SystemExit('build_moe_ffn opening brace missing')
          depth = 0
          end = None
          for i in range(open_brace, len(text)):
              if text[i] == '{':
                  depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('build_moe_ffn closing brace missing')

          original = text[start:end]
          signature = original[:original.find('{')]
          body = original[original.find('{') + 1:-1]
          exec_marker = '    cur = ggml_reshape_3d(ctx0, cur, n_embd, 1, n_tokens);\n'
          split = body.find(exec_marker)
          if split < 0:
              raise SystemExit('MoE routing/execution split marker missing')
          router_body = body[:split]
          execution_body = body[split:]
          router_body = router_body.replace('    const int64_t n_embd   = cur->ne[0];\n', '', 1)
          router_body = router_body.replace(
              '    const bool weight_before_ffn = arch == LLM_ARCH_LLAMA4; // for llama4, we apply the sigmoid-ed weights before the FFN\n',
              '', 1)

          routing_function = '''llm_graph_moe_routing llm_graph_context::build_moe_routing(
                   ggml_tensor * cur,
                   ggml_tensor * gate_inp,
                   ggml_tensor * gate_inp_b,
                   ggml_tensor * exp_probs_b,
                       int64_t   n_expert,
                       int64_t   n_expert_used,
                          bool   norm_w,
                         float   w_scale,
              llama_expert_gating_func_type gating_op,
                           int   il,
                   ggml_tensor * probs_in) const {\n''' + router_body + '''
              return { selected_experts, weights };
          }

          '''

          execution_function = '''ggml_tensor * llm_graph_context::build_moe_ffn_experts(
                   ggml_tensor * cur,
                   ggml_tensor * up_exps,
                   ggml_tensor * up_exps_b,
                   ggml_tensor * gate_exps,
                   ggml_tensor * gate_exps_b,
                   ggml_tensor * down_exps,
                   ggml_tensor * down_exps_b,
                       int64_t   n_expert,
                       int64_t   n_expert_used,
               llm_ffn_op_type   type_op,
                           int   il,
              const llm_graph_moe_routing & routing,
                   ggml_tensor * gate_up_exps,
                   ggml_tensor * gate_up_exps_b,
                   ggml_tensor * up_exps_s,
                   ggml_tensor * gate_exps_s,
                   ggml_tensor * down_exps_s,
                          bool   allow_missing_ids) const {
              const int64_t n_embd   = cur->ne[0];
              const int64_t n_tokens = cur->ne[1];
              const bool weight_before_ffn = arch == LLM_ARCH_LLAMA4;
              ggml_tensor * selected_experts = routing.selected_experts;
              ggml_tensor * weights = routing.weights;

              GGML_ASSERT(selected_experts != nullptr && weights != nullptr);
              GGML_ASSERT(selected_experts->ne[0] == n_expert_used);
              if (allow_missing_ids) {
                  GGML_ASSERT(!weight_before_ffn);
                  GGML_ASSERT(up_exps_b == nullptr && gate_exps_b == nullptr && down_exps_b == nullptr);
                  GGML_ASSERT(gate_up_exps_b == nullptr);
                  GGML_ASSERT(up_exps_s == nullptr && gate_exps_s == nullptr && down_exps_s == nullptr);
              }

          ''' + execution_body + '''

          '''
          execution_function = execution_function.replace(
              'build_lora_mm_id(gate_up_exps, cur, selected_experts)',
              'build_lora_mm_id(gate_up_exps, cur, selected_experts, allow_missing_ids)')
          execution_function = execution_function.replace(
              'build_lora_mm_id(up_exps, cur, selected_experts)',
              'build_lora_mm_id(up_exps, cur, selected_experts, allow_missing_ids)')
          execution_function = execution_function.replace(
              'build_lora_mm_id(gate_exps, cur, selected_experts)',
              'build_lora_mm_id(gate_exps, cur, selected_experts, allow_missing_ids)')
          execution_function = execution_function.replace(
              'build_lora_mm_id(down_exps, cur, selected_experts)',
              'build_lora_mm_id(down_exps, cur, selected_experts, allow_missing_ids)')

          wrapper_body = '''
              const auto routing = build_moe_routing(
                  cur, gate_inp, gate_inp_b, exp_probs_b,
                  n_expert, n_expert_used, norm_w, w_scale, gating_op, il, probs_in);
              return build_moe_ffn_experts(
                  cur,
                  up_exps, up_exps_b,
                  gate_exps, gate_exps_b,
                  down_exps, down_exps_b,
                  n_expert, n_expert_used, type_op, il, routing,
                  gate_up_exps, gate_up_exps_b,
                  up_exps_s, gate_exps_s, down_exps_s,
                  false);
          '''
          wrapper = signature + '{' + wrapper_body + '}\n'

          cpp.write_text(text[:start] + routing_function + execution_function + wrapper + text[end:])
          PY
          git diff --check

      - name: Configure CPU compile check
        run: >-
          cmake -S . -B build-graph -G Ninja
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=ON
          -DLLAMA_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build graph and MoE tests
        run: |
          cmake --build build-graph --parallel --target llama-moe-load-check test-moe-route-partition test-moe-registry
          ctest --test-dir build-graph --output-on-failure -R '^test-moe-(route-partition|registry)$'

      - name: Commit graph refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/llama-graph.h src/llama-graph.cpp
          git commit -m 'moe: separate routing from expert execution'
          git push origin HEAD:agent/static-moe-expert-placement
