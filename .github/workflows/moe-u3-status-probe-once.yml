name: MoE U3 Status Probe

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-u3-status-probe-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Query workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          query = urllib.parse.urlencode({
              'branch': 'agent/static-moe-expert-placement',
              'event': 'push',
              'per_page': 100,
          })
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?{query}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              data = json.load(response)
          matches = [
              run for run in data.get('workflow_runs', [])
              if run.get('name') == 'MoE U3 MMVQ Missing-ID Fix'
          ]
          matches.sort(key=lambda run: run.get('created_at', ''), reverse=True)
          result = matches[0] if matches else {'error': 'workflow run not found'}
          compact = {
              key: result.get(key)
              for key in (
                  'id', 'name', 'status', 'conclusion', 'html_url',
                  'head_sha', 'created_at', 'updated_at', 'run_attempt'
              )
              if key in result
          }
          Path('.github/moe-u3-mmvq-build-status.json').write_text(
              json.dumps(compact, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish status
        shell: bash
        run: |
          rm .github/workflows/moe-u3-status-probe-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/moe-u3-mmvq-build-status.json .github/workflows/moe-u3-status-probe-once.yml
          git commit -m "ci: record U3 MMVQ build status"
          git pull --rebase origin agent/static-moe-expert-placement
          git push origin HEAD:agent/static-moe-expert-placement
