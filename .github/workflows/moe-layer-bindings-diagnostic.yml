name: MoE Layer Bindings Diagnostic

on:
  push:
    branches:
      - agent/static-moe-expert-placement
    paths:
      - '.github/workflows/moe-layer-bindings-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/static-moe-expert-placement
          fetch-depth: 1

      - name: Apply and validate compact layer bindings
        shell: bash
        run: |
          set +e
          rm -f moe-layer-bindings-error.txt
          {
            python3 .github/scripts/moe_layer_bindings.py
            git diff --check
            cmake -S . -B build-bindings -G Ninja \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLAMA_CURL=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_TOOLS=ON \
              -DLLAMA_BUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-bindings --parallel --target llama-moe-load-check
          } > moe-layer-bindings-run.log 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            rm -f moe-layer-bindings-error.txt
            git add src/llama-model.h src/models/qwen35moe.cpp
            git commit -m 'moe: bind compact tensors to model layers'
          else
            mv moe-layer-bindings-run.log moe-layer-bindings-error.txt
            git add moe-layer-bindings-error.txt
            git commit -m 'ci: capture compact layer binding failure'
          fi

          git push origin HEAD:agent/static-moe-expert-placement
          exit "$status"
